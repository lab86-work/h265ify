[project]
name = "h265ify"
version = "0.1.0"
description = "GPU-only HEVC/H.265 video transcoder — detects available hardware and re-encodes videos in-place."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "h265ify contributors" },
]
keywords = ["video", "transcode", "hevc", "h265", "ffmpeg", "gpu"]

dependencies = [
    "python-dotenv>=1.0",
]

[project.scripts]
h265ify = "h265ify.transcoder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h265ify"]

[tool.hatch.build.targets.sdist]
include = ["src/**"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
